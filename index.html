<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成语大冒险 - 移动端完美版</title>
    <style>
        :root {
            --primary: #6EB5FF; --success: #6BCB77; --danger: #FF8AAE;
            --warning: #FFD93D; --bg: #E8F9FF; --text: #4B5D67;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg); margin: 0;
            display: flex; justify-content: center; align-items: flex-start;
            height: 100vh; width: 100vw; overflow: hidden;
            touch-action: none; /* 防止页面整体随拖拽滚动 */
        }

        /* 状态栏 */
        .status-bar {
            position: fixed; top: 10px; width: 92%; height: 50px;
            background: rgba(255, 255, 255, 0.9); display: flex; 
            justify-content: space-between; align-items: center; 
            padding: 0 15px; z-index: 1000; border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .score-display { font-size: 1.1rem; font-weight: bold; color: #FF9F29; background: #FFFBE9; padding: 4px 12px; border-radius: 15px; border: 2px solid var(--warning); }
        .progress-container { width: 45%; height: 10px; background: #E2E8F0; border-radius: 5px; }
        #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6BCB77, #A7FF83); border-radius: 5px; transition: width 0.3s; }

        /* 游戏容器 */
        .game-card {
            background: white; width: 100%; height: 100%;
            padding: 75px 15px 30px 15px; display: flex; flex-direction: column;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        /* 菜单 */
        .menu-title { font-size: 1.8rem; color: #2D31FA; margin-bottom: 20px; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item {
            padding: 15px; border: 3px solid #E2E8F0; border-radius: 20px;
            background: white; text-align: center;
            box-shadow: 0 6px 0px #E2E8F0;
        }

        /* 题目元素 */
        .instruction { color: #64748B; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .scenario-box { 
            background: #F0F7FF; padding: 20px; border-radius: 20px; 
            border: 3px solid #D0E8FF; font-size: 1.2rem; line-height: 1.6; 
            margin-bottom: 15px; color: #333; position: relative;
        }

        /* 拖拽核心样式 */
        .matching-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;}
        .image-box { background: #FDF6F0; padding: 10px; border-radius: 20px; border: 2px solid #FFE5D9; text-align: center; position: relative; }
        .idiom-img { width: 100%; height: 120px; object-fit: contain; background: white; border-radius: 12px; }
        .drop-zone { min-height: 50px; border: 2px dashed #FFD1BB; margin-top: 8px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding: 5px; }
        
        .pool-area { background: #F1F5F9; padding: 15px; border-radius: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 100px; margin-bottom: 100px;}
        
        .idiom-card { 
            background: var(--primary); color: white; padding: 10px 15px; 
            border-radius: 12px; font-size: 0.95rem; font-weight: bold; 
            box-shadow: 0 4px 0px #357ABD; touch-action: none; 
            position: relative; z-index: 10;
        }

        /* 拖动时的视觉状态 */
        .dragging { opacity: 0.8; transform: scale(1.1); z-index: 1000 !important; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .option-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: white; border: 3px solid #E2E8F0; padding: 14px; border-radius: 18px; font-size: 1.05rem; box-shadow: 0 5px 0px #E2E8F0; }

        .score-float { position: fixed; font-size: 2.5rem; font-weight: bold; animation: floatUp 0.8s forwards; pointer-events: none; z-index: 2000; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
        
        .correct-anim { background: var(--success) !important; color: white !important; box-shadow: 0 5px 0px #4CAF50 !important; }
        .wrong-anim { animation: shake 0.4s; background: var(--danger) !important; color: white !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-6px);} 75% {transform: translateX(6px);} }

        .btn-next { background: linear-gradient(180deg, #FFD93D, #FF9F29); color: white; border: none; padding: 16px; border-radius: 30px; font-size: 1.2rem; font-weight: bold; margin-top: 20px; width: 100%; display: none; box-shadow: 0 6px 0px #D87D00; }
        .rank-box { padding: 20px; border-radius: 25px; background: #FFFBE9; border: 3px solid #FFD93D; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>

<div class="status-bar" id="status-bar" style="display:none;">
    <button style="background:#94A3B8; color:white; border:none; padding:6px 12px; border-radius:15px;" onclick="showMenu()">🏠 返回</button>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div class="score-display">⭐ <span id="total-score">0</span></div>
</div>

<div class="game-card" id="game-container"></div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(f, t, d) {
        try {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        } catch(e) {}
    }
    const soundCorrect = () => { playSound(880, 'sine', 0.2); setTimeout(()=>playSound(1100, 'sine', 0.2), 100); };
    const soundWrong = () => playSound(150, 'triangle', 0.4);

    const r1Data = [
        { labels: ['A', 'B'], pos: ["手舞足蹈", "欢天喜地"], neg: ["闷闷不乐", "垂头丧气"] },
        { labels: ['C', 'D'], pos: ["五颜六色", "色彩缤纷"], neg: ["暗淡无光", "灰暗单调"] }
        // 老师可在此继续添加数据...
    ];

    const r2Data = [
        { context: "全家人要去旅游，弟弟高兴得________。", ans: "手舞足蹈", options: ["手舞足蹈", "垂头丧气"] },
        { context: "深夜街道没有灯，看过去________。", ans: "暗淡无光", options: ["色彩缤纷", "暗淡无光"] }
    ];

    const r3Data = [
        { q: "“高兴得手舞足蹈。”哪个成语与“手舞足蹈”意思相反？", options: ["A. 欢天喜地", "B. 闷闷不乐", "C. 活蹦乱跳", "D. 眉开眼笑"], ans: "B. 闷闷不乐" }
    ];

    const r4Data = [
        { q: "哪句正确使用了“五颜六色”？", options: ["A. 房间整理得五颜六色", "B. 天空挂着五颜六色的彩虹", "C. 故事讲得五颜六色", "D. 穿黑色的五颜六色衣服"], ans: "B" }
    ];

    let score = 0, step = 0, currentRound = 0;
    const container = document.getElementById('game-container');

    function showMenu() {
        window.speechSynthesis.cancel(); currentRound = 0; step = 0; score = 0;
        document.getElementById('status-bar').style.display = 'none';
        container.innerHTML = `
            <div style="text-align:center;"><h1 class="menu-title">成语大挑战 🏆</h1></div>
            <div class="menu-grid">
                <div class="menu-item" onclick="startRound(1)"><span>🎨</span><h3>第一回合</h3><p>拖拽配对</p></div>
                <div class="menu-item" onclick="startRound(2)"><span>📝</span><h3>第二回合</h3><p>句子填空</p></div>
                <div class="menu-item" onclick="startRound(3)"><span>📣</span><h3>第三回合</h3><p>近义反义</p></div>
                <div class="menu-item" onclick="startRound(4)"><span>✅</span><h3>第四回合</h3><p>语境辨析</p></div>
            </div>`;
    }

    function startRound(r) { currentRound = r; step = 0; document.getElementById('status-bar').style.display = 'flex'; render(); }

    function updateScore(amount, x, y) {
        score = Math.max(0, score + amount);
        document.getElementById('total-score').innerText = score;
        const f = document.createElement('div'); f.className = 'score-float';
        f.innerText = amount > 0 ? `+${amount}` : amount;
        f.style.color = amount > 0 ? '#6BCB77' : '#FF8AAE';
        f.style.left = `${x}px`; f.style.top = `${y}px`;
        document.body.appendChild(f); setTimeout(() => f.remove(), 800);
        if(amount > 0) soundCorrect(); else soundWrong();
    }

    function render() {
        const data = [null, r1Data, r2Data, r3Data, r4Data][currentRound];
        document.getElementById('progress-bar').style.width = `${((step+1)/data.length)*100}%`;
        const qData = data[step];
        let html = `<div class="instruction">第 ${currentRound} 回合：第 ${step+1}/${data.length} 题</div>`;

        if (currentRound === 1) {
            html += `<div class="matching-area">
                <div class="image-box"><b>图 ${qData.labels[0]}</b><img src="${qData.labels[0]}.png" class="idiom-img"><div class="drop-zone" data-valid='${JSON.stringify(qData.pos)}'></div></div>
                <div class="image-box"><b>图 ${qData.labels[1]}</b><img src="${qData.labels[1]}.png" class="idiom-img"><div class="drop-zone" data-valid='${JSON.stringify(qData.neg)}'></div></div>
            </div><div class="pool-area" id="pool">
                ${[...qData.pos, ...qData.neg].sort(()=>Math.random()-0.5).map(w=>`<div class="idiom-card touch-drag">${w}</div>`).join('')}
            </div>`;
        } else if (currentRound === 2) {
            html += `<div class="scenario-box">🔊 ${qData.context.replace('________', `<span style="border-bottom:2px solid #6EB5FF; color:#6EB5FF; padding:0 10px;">?</span>`)}</div>
                <div class="option-list">${qData.options.map(o => `<button class="option-btn" onclick="checkBtn(this, '${o}', '${qData.ans}', event)">${o}</button>`).join('')}</div>`;
        } else {
            html += `<div class="scenario-box" onclick="speakText()">🔊 ${qData.q}</div>
                <div class="option-list">${qData.options.map(o => `<button class="option-btn" onclick="checkBtn(this, '${o}', '${qData.ans}', event)">${o}</button>`).join('')}</div>`;
        }
        html += `<button class="btn-next" id="bn" onclick="next()">下一题 ➔</button>`;
        container.innerHTML = html;
        if(currentRound === 1) initTouchDrag();
    }

    function checkBtn(btn, ch, ans, e) {
        if(ch.includes(ans)) { btn.classList.add('correct-anim'); updateScore(20, e.clientX, e.clientY); document.getElementById('bn').style.display='block'; }
        else { btn.classList.add('wrong-anim'); updateScore(-10, e.clientX, e.clientY); setTimeout(()=>btn.classList.remove('wrong-anim'), 400); }
    }

    // --- 核心：手机拖拽逻辑 ---
    function initTouchDrag() {
        const cards = document.querySelectorAll('.touch-drag');
        const zones = document.querySelectorAll('.drop-zone');

        cards.forEach(card => {
            let startX, startY, origX, origY;

            card.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startX = touch.clientX; startY = touch.clientY;
                const rect = card.getBoundingClientRect();
                origX = rect.left; origY = rect.top;
                
                card.classList.add('dragging');
                card.style.position = 'fixed';
                card.style.left = origX + 'px';
                card.style.top = origY + 'px';
                card.style.width = rect.width + 'px';
            }, {passive: false});

            card.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                card.style.left = (origX + touch.clientX - startX) + 'px';
                card.style.top = (origY + touch.clientY - startY) + 'px';
            }, {passive: false});

            card.addEventListener('touchend', (e) => {
                card.classList.remove('dragging');
                const touch = e.changedTouches[0];
                const targetZone = findDropZone(touch.clientX, touch.clientY);

                if (targetZone) {
                    const validWords = JSON.parse(targetZone.dataset.valid);
                    if (validWords.includes(card.innerText)) {
                        // 成功放入
                        card.style.position = 'static';
                        card.style.width = 'auto';
                        targetZone.appendChild(card);
                        updateScore(10, touch.clientX, touch.clientY);
                        checkWinR1();
                        return;
                    }
                }
                // 失败回位
                card.style.position = 'static';
                card.style.width = 'auto';
                updateScore(-5, touch.clientX, touch.clientY);
                card.classList.add('wrong-anim');
                setTimeout(()=>card.classList.remove('wrong-anim'), 400);
            });
        });
    }

    function findDropZone(x, y) {
        const zones = document.querySelectorAll('.drop-zone');
        for (let zone of zones) {
            const rect = zone.getBoundingClientRect();
            if (x > rect.left && x < rect.right && y > rect.top && y < rect.bottom) return zone;
        }
        return null;
    }

    function checkWinR1() {
        const pool = document.getElementById('pool');
        if (pool && pool.children.length === 0) document.getElementById('bn').style.display = 'block';
    }

    function next() { step++; const d = [null,r1Data,r2Data,r3Data,r4Data][currentRound]; if(step < d.length) render(); else fin(); }

    function fin() {
        let lv = Math.min(6, Math.floor(score/30)+1);
        container.innerHTML = `<div style="text-align:center; padding-top:40px;"><h1>⭐</h1><h2>大功告成！</h2><div class="rank-box"><span style="font-size:3rem; color:#FF9F29;">${lv} 级</span></div><button class="btn-next" style="display:inline-block" onclick="showMenu()">再玩一次</button></div>`;
    }

    function speakText() {
        const data = [null, r1Data, r2Data, r3Data, r4Data][currentRound];
        let t = data[step].q.replace(/<[^>]+>/g, '');
        if(currentRound === 4) data[step].options.forEach(o => t += "。选项 " + o.replace('.', '：'));
        const m = new SpeechSynthesisUtterance(t); m.lang='zh-CN'; window.speechSynthesis.speak(m);
    }

    showMenu();
</script>
</body>
</html>
