<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成语大冒险 - 逻辑增强版</title>
    <style>
        :root {
            --primary: #6EB5FF; --success: #6BCB77; --danger: #FF8AAE;
            --warning: #FFD93D; --bg: #E8F9FF;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; user-select: none; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg); margin: 0;
            display: flex; justify-content: center; height: 100vh; width: 100vw; overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            position: fixed; top: 10px; width: 92%; height: 50px;
            background: rgba(255, 255, 255, 0.95); display: flex; 
            justify-content: space-between; align-items: center; 
            padding: 0 15px; z-index: 1000; border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .score-display { font-size: 1.1rem; font-weight: bold; color: #FF9F29; background: #FFFBE9; padding: 4px 12px; border-radius: 15px; border: 2px solid var(--warning); }
        .progress-container { width: 45%; height: 10px; background: #E2E8F0; border-radius: 5px; }
        #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6BCB77, #A7FF83); border-radius: 5px; transition: width 0.3s; }

        /* 内容卡片 */
        .game-card {
            background: white; width: 100%; height: 100%;
            padding: 75px 15px 30px 15px; display: flex; flex-direction: column;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        /* 第一回合：字母匹配布局 */
        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .img-card { background: #FDF6F0; border: 3px solid #FFE5D9; border-radius: 20px; padding: 10px; text-align: center; }
        .idiom-img { width: 100%; height: 100px; object-fit: contain; background: white; border-radius: 12px; margin-bottom: 10px; }
        
        .letter-input {
            width: 50px; height: 50px; border: 3px solid var(--primary);
            border-radius: 50%; font-size: 1.5rem; font-weight: bold;
            color: var(--primary); text-align: center; line-height: 44px;
            background: white; display: block; margin: 0 auto; outline: none;
        }
        .letter-input.correct { background: var(--success); color: white; border-color: var(--success); }
        
        .word-bank {
            background: #F1F5F9; padding: 12px; border-radius: 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .word-tag { background: white; padding: 8px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; border: 1px solid #ddd; }
        .word-tag span { color: var(--danger); margin-right: 4px; font-size: 1rem; }

        /* 通用样式 */
        .menu-title { font-size: 1.8rem; color: #2D31FA; margin-bottom: 20px; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { padding: 20px 10px; border: 3px solid #E2E8F0; border-radius: 25px; background: white; text-align: center; box-shadow: 0 6px 0px #E2E8F0; }
        
        .scenario-box { background: #F0F7FF; padding: 20px; border-radius: 20px; border: 3px solid #D0E8FF; font-size: 1.2rem; margin-bottom: 15px; line-height: 1.6; }
        .option-btn { background: white; border: 3px solid #E2E8F0; padding: 15px; border-radius: 18px; font-size: 1.1rem; margin-bottom: 10px; text-align: left; width: 100%; box-shadow: 0 5px 0px #E2E8F0; }

        .btn-next { background: linear-gradient(180deg, #FFD93D, #FF9F29); color: white; border: none; padding: 18px; border-radius: 35px; font-size: 1.3rem; font-weight: bold; width: 100%; display: none; box-shadow: 0 6px 0px #D87D00; }
        
        .correct-anim { background: var(--success) !important; color: white !important; animation: bounce 0.5s; }
        @keyframes bounce { 0%,100% {transform: scale(1);} 50% {transform: scale(1.1);} }
        .wrong-anim { animation: shake 0.4s; background: var(--danger) !important; color: white !important; }
        @keyframes shake { 0%,100% {transform:translateX(-5px);} 50% {transform:translateX(5px);} }
    </style>
</head>
<body>

<div class="status-bar" id="status-bar" style="display:none;">
    <button style="background:#94A3B8; color:white; border:none; padding:6px 12px; border-radius:15px;" onclick="showMenu()">🏠 返回</button>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div class="score-display">⭐ <span id="total-score">0</span></div>
</div>

<div class="game-card" id="game-container"></div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(f, d) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    }

    // --- 第一回合数据：每页2图，4个词卡（2正确+2无关干扰项） ---
    // Distractors: 选用了中性成语，确保非同义、非反义。
    const r1Data = [
        { imgs: [{id:'A', src:'A.png', idiom:'手舞足蹈'}, {id:'B', src:'B.png', idiom:'闷闷不乐'}], distractors:['画蛇添足', '对牛弹琴'] },
        { imgs: [{id:'C', src:'C.png', idiom:'五颜六色'}, {id:'D', src:'D.png', idiom:'暗淡无光'}], distractors:['守株待兔', '拔苗助长'] },
        { imgs: [{id:'E', src:'E.png', idiom:'头晕目眩'}, {id:'F', src:'F.png', idiom:'神采飞扬'}], distractors:['饮水思源', '井底之蛙'] },
        { imgs: [{id:'G', src:'G.png', idiom:'无影无踪'}, {id:'H', src:'H.png', idiom:'历历在目'}], distractors:['亡羊补牢', '刻舟求剑'] },
        { imgs: [{id:'I', src:'I.png', idiom:'垂头丧气'}, {id:'J', src:'J.png', idiom:'昂首挺胸'}], distractors:['闻鸡起舞', '卧薪尝胆'] },
        { imgs: [{id:'K', src:'K.png', idiom:'一塌糊涂'}, {id:'L', src:'L.png', idiom:'井井有条'}], distractors:['破釜沉舟', '完璧归赵'] },
        { imgs: [{id:'M', src:'M.png', idiom:'晴天霹雳'}, {id:'N', src:'N.png', idiom:'意料之中'}], distractors:['纸上谈兵', '负荆请罪'] },
        { imgs: [{id:'O', src:'O.png', idiom:'如愿以偿'}, {id:'P', src:'P.png', idiom:'求而不得'}], distractors:['草船借箭', '指鹿为马'] }
    ];

    const r2Data = [
        { q: "全家人要去旅游，弟弟高兴得________。", ans: "手舞足蹈", opts: ["手舞足蹈", "垂头丧气"] },
        { q: "深夜街道没有灯，看过去________。", ans: "暗淡无光", opts: ["五颜六色", "暗淡无光"] },
        { q: "他在烈日下跑了很久，感到________。", ans: "天旋地转", opts: ["天旋地转", "神清气爽"] },
        { q: "虽然比赛输了，但运动员依然________。", ans: "昂首挺胸", opts: ["垂头丧气", "昂首挺胸"] }
    ];

    // 后续回合数据略（保持前次一致）...
    const r3Data = [ { q: "哪个成语与<b>“手舞足蹈”</b>意思相反？", opts: ["A. 欢天喜地", "B. 闷闷不乐", "C. 活蹦乱跳", "D. 眉开眼笑"], ans: "B" } ];
    const r4Data = [ { q: "哪句正确使用了<b>“五颜六色”</b>？", opts: ["A. 房间整理得五颜六色", "B. 天空挂着五颜六色的彩虹", "C. 故事讲得五颜六色", "D. 穿黑色的五颜六色衣服"], ans: "B" } ];

    let score = 0, step = 0, currentRound = 0;
    const container = document.getElementById('game-container');

    function showMenu() {
        window.speechSynthesis.cancel(); currentRound = 0; step = 0; score = 0;
        document.getElementById('status-bar').style.display = 'none';
        container.innerHTML = `
            <h1 class="menu-title">成语大冒险 🏆</h1>
            <div class="menu-grid">
                <div class="menu-item" onclick="startRound(1)"><h3>第一回合</h3><p>图文配对</p></div>
                <div class="menu-item" onclick="startRound(2)"><h3>第二回合</h3><p>填空挑战</p></div>
                <div class="menu-item" onclick="startRound(3)"><h3>第三回合</h3><p>近义反义</p></div>
                <div class="menu-item" onclick="startRound(4)"><h3>第四回合</h3><p>语境辨析</p></div>
            </div>`;
    }

    function startRound(r) { currentRound = r; step = 0; document.getElementById('status-bar').style.display = 'flex'; render(); }

    function render() {
        const data = [null, r1Data, r2Data, r3Data, r4Data][currentRound];
        document.getElementById('progress-bar').style.width = `${((step+1)/data.length)*100}%`;
        const q = data[step];
        let html = `<div style="text-align:center; font-weight:bold; color:#64748B; margin-bottom:10px;">第 ${step+1}/${data.length} 题</div>`;

        if (currentRound === 1) {
            // --- 第一回合核心逻辑：乱序分配字母 ---
            const allOptions = [...q.imgs.map(i => i.idiom), ...q.distractors].sort(() => Math.random() - 0.5);
            const letters = ['A', 'B', 'C', 'D'];
            const bankWithLetters = allOptions.map((w, i) => ({ letter: letters[i], word: w }));
            
            // 记录当前题目正确的字母映射
            window.currentAnswerMap = {};
            q.imgs.forEach(imgObj => {
                const found = bankWithLetters.find(b => b.word === imgObj.idiom);
                window.currentAnswerMap[imgObj.id] = found.letter;
            });

            html += `<div class="scenario-box">观察插图，填入下方对应成语的字母。</div>
                <div class="match-grid">
                    ${q.imgs.map(item => `
                        <div class="img-card">
                            <b>图 ${item.id}</b>
                            <img src="${item.src}" class="idiom-img">
                            <input type="text" class="letter-input" maxlength="1" 
                                   oninput="checkR1(this, '${item.id}', event)"
                                   placeholder="?">
                        </div>
                    `).join('')}
                </div>
                <div class="word-bank">
                    ${bankWithLetters.map(b => `<div class="word-tag"><span>${b.letter}</span> ${b.word}</div>`).join('')}
                </div>`;
        } else {
            // 回合 2, 3, 4 保持前次逻辑
            html += `<div class="scenario-box">🔊 ${q.q || q.context}</div>
                ${(q.opts || q.options).map(o => `<button class="option-btn" onclick="checkOther(this, '${o}', '${q.ans}', event)">${o}</button>`).join('')}`;
            if(currentRound > 1) speak(q.q || q.context);
        }

        html += `<button class="btn-next" id="bn" onclick="next()">下一题 ➔</button>`;
        container.innerHTML = html;
    }

    function checkR1(input, imgId, e) {
        const val = input.value.toUpperCase();
        const correctLetter = window.currentAnswerMap[imgId];
        if (val === correctLetter) {
            input.classList.add('correct'); input.disabled = true;
            playSfx(880, 0.2); updateScore(20);
            if(Array.from(document.querySelectorAll('.letter-input')).every(i => i.classList.contains('correct'))) 
                document.getElementById('bn').style.display = 'block';
        } else if (val !== "") {
            input.value = ""; input.classList.add('wrong-anim');
            playSfx(150, 0.4); updateScore(-5);
            setTimeout(() => input.classList.remove('wrong-anim'), 400);
        }
    }

    function checkOther(btn, val, ans, e) {
        if (val.includes(ans)) {
            btn.classList.add('correct-anim'); playSfx(880, 0.2); updateScore(20);
            document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
            document.getElementById('bn').style.display = 'block';
        } else {
            btn.classList.add('wrong-anim'); playSfx(150, 0.4); updateScore(-10);
            setTimeout(() => btn.classList.remove('wrong-anim'), 400);
        }
    }

    function updateScore(n) { score = Math.max(0, score + n); document.getElementById('total-score').innerText = score; }
    function next() { step++; const d = [null,r1Data,r2Data,r3Data,r4Data][currentRound]; if(step < d.length) render(); else finish(); }
    
    function finish() {
        container.innerHTML = `<div style="text-align:center; padding:50px 10px;"><h1>🏆</h1><h2>挑战成功！</h2><div style="font-size:2rem; color:var(--warning); font-weight:bold; margin:20px;">⭐ ${score}</div><button class="btn-next" style="display:block" onclick="showMenu()">返回主菜单</button></div>`;
    }

    function speak(t) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'')); m.lang='zh-CN'; window.speechSynthesis.speak(m); }
    showMenu();
</script>
</body>
</html>
